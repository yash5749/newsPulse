services:
  # PostgreSQL Database
  - type: pserv
    name: newspulse-db
    region: oregon
    plan: free
    databaseName: newspulse
    user: newspulse
    ipAllowList: []
    postgresMajorVersion: "16"

  # Node.js Backend API
  - type: web
    name: newspulse-api
    region: oregon
    plan: free
    runtime: node
    buildCommand: "cd backend && npm ci && npm run build"
    startCommand: "cd backend && npm run start"
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase:
          name: newspulse-db
          property: connectionString
      - key: PYTHON_SERVICE_URL
        value: https://newspulse-ingestion.onrender.com
      - key: CLUSTER_SIMILARITY_THRESHOLD
        value: "0.30"
      - key: CLUSTER_TIME_WINDOW_DAYS
        value: "7"
      - key: CORS_ORIGIN
        value: "https://newspulse.vercel.app"

  # Python Ingestion Service
  - type: web
    name: newspulse-ingestion
    region: oregon
    plan: free
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Primary: connectionString from managed database
      - key: DATABASE_URL
        fromDatabase:
          name: newspulse-db
          property: connectionString
      # Fallback: individual properties (Render also provides these)
      - key: DB_HOST
        fromDatabase:
          name: newspulse-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: newspulse-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: newspulse-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: newspulse-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: newspulse-db
          property: password
      - key: CLUSTER_SIMILARITY_THRESHOLD
        value: "0.30"
      - key: CLUSTER_TIME_WINDOW_DAYS
        value: "7"
      - key: REQUEST_TIMEOUT
        value: "30"
      - key: USER_AGENT
        value: "NewsPulse/1.0"
      - key: LOG_LEVEL
        value: "INFO"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SSL_CERT_FILE
        value: "/etc/ssl/certs/ca-certificates.crt"